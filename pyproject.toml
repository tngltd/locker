[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locker"
version = "1.0.0"
description = "Android-based service lockdown for Ubuntu — stop services when your device is disconnected"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "Lock Service Team", email = "admin@example.com"}
]
keywords = ["security", "lock", "ubuntu", "android", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "python-daemon>=3.0.0",
    "psutil>=5.8.0",
    "pyudev>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
]
build = [
    "setuptools>=60.0.0",
    "wheel>=0.37.0",
    "build>=0.8.0",
    "twine>=4.0.0",
]

[project.scripts]
locker = "locker.cli:main"
lockerd = "locker.service:main"

[project.urls]
Homepage = "https://github.com/example/locker"
Documentation = "https://github.com/example/locker/wiki"
Repository = "https://github.com/example/locker"
"Bug Reports" = "https://github.com/example/locker/issues"

[tool.setuptools]
packages = ["locker"]
package-dir = {"" = "src"}
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"locker" = ["*.json"]

[tool.setuptools.data-files]
"/etc/locker" = [
    "config/config.json",
]
"/etc/systemd/system" = [
    "config/locker.service",
]
"/usr/share/locker/scripts" = [
    "scripts/install.sh",
    "scripts/setup.sh",
    "scripts/uninstall.sh",
]
"/usr/share/locker/docs" = [
    "docs/documentation.html",
]

[tool.coverage.run]
relative_files = true
source = ["src"]
omit = ["tests/*", "venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
